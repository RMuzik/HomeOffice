name: 🔍 SCOUT — Weekly Research Pipeline

on:
  schedule:
    # Chaque lundi à 00:00 UTC (02:00 heure de Paris)
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode de run'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - keywords-only
          - products-only
          - dry-run

env:
  NODE_VERSION: '20'

jobs:
  scout:
    name: 🔍 Agent SCOUT
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Run SCOUT Agent
        env:
          AMAZON_ACCESS_KEY: ${{ secrets.AMAZON_ACCESS_KEY }}
          AMAZON_SECRET_KEY: ${{ secrets.AMAZON_SECRET_KEY }}
          AMAZON_ASSOCIATE_TAG: ${{ secrets.AMAZON_ASSOCIATE_TAG }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          MODE_FLAG=""
          if [ "${{ github.event.inputs.mode }}" = "keywords-only" ]; then
            MODE_FLAG="--keywords"
          elif [ "${{ github.event.inputs.mode }}" = "products-only" ]; then
            MODE_FLAG="--products"
          elif [ "${{ github.event.inputs.mode }}" = "dry-run" ]; then
            MODE_FLAG="--dry-run"
          fi
          node agents/scout/index.js $MODE_FLAG

      - name: 💾 Commit data files
        if: github.event.inputs.mode != 'dry-run'
        run: |
          git config --local user.email "apex-bot@homeofficesetup.pro"
          git config --local user.name "APEX Bot"
          git add data/keywords.json data/products.json data/pins-queue.json data/logs/ || true
          git diff --staged --quiet || git commit -m "🤖 SCOUT: Weekly data update $(date +%Y-%m-%d)"
          git push

      - name: 📢 Discord notification
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          STATUS="${{ job.status }}"
          EMOJI=$([ "$STATUS" = "success" ] && echo "✅" || echo "❌")
          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"$EMOJI **SCOUT** terminé — Status: $STATUS\"}" || true
