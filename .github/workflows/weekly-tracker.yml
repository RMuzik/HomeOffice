name: 📊 TRACKER — Weekly Analytics & Report

on:
  schedule:
    - cron: '0 18 * * 5'  # Vendredi 18h UTC (20h Paris)
  workflow_dispatch:

jobs:
  tracker:
    name: 📊 Agent TRACKER
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: 📊 Run TRACKER Agent
        env:
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: node agents/tracker/index.js

      - name: 💾 Commit report
        run: |
          git config --local user.email "apex-bot@homeofficesetup.pro"
          git config --local user.name "APEX Bot"
          git add data/reports/ data/logs/ || true
          git diff --staged --quiet || git commit -m "📊 TRACKER: rapport semaine $(date +%Y-%m-%d)"
          git push
